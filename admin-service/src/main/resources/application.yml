spring :
  application :
    name : admin-service
  datasource:
    url: jdbc:postgresql://localhost:5433/yugabyte
    username: yugabyte
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        type:
          json_format_mapper: jackson
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migrations
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080

